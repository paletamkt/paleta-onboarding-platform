<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Onboarding — Paleta</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="cliente-page">

  <!-- Splash automático -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-inner">
      <div class="splash-logos">
        <img src="/assets/logo-food.png" alt="Paleta Food" />
        <div class="splash-logos-divider"></div>
        <img src="/assets/logo-mkt.png" alt="Paleta Mkt" />
      </div>
      <h1 id="splashNome" class="splash-nome"></h1>
      <p class="splash-sub">Seu onboarding está pronto.</p>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Interface principal -->
  <div id="mainContent" class="main-content hidden">

    <header class="top-bar">
      <div class="top-brand">
        <img id="topLogo" src="" alt="Paleta" class="top-logo-img" />
      </div>
      <div class="top-right">
        <span id="nomeCliente" class="cliente-nome"></span>
        <button id="btnSair" class="btn-sair">Sair</button>
      </div>
    </header>

    <main class="cliente-main">

      <!-- Header -->
      <div class="cliente-header">
        <div>
          <p class="eyebrow">Onboarding</p>
          <h1 id="tituloCliente"></h1>
          <div id="statusBadge" style="margin-top:8px"></div>
        </div>
        <div class="progresso-geral">
          <div class="progresso-numero" id="progressoNumero">0%</div>
          <div class="progresso-label">concluído</div>
          <div class="progresso-bar-wrap">
            <div class="progresso-bar-fill" id="progressoBar"></div>
          </div>
        </div>
      </div>

      <!-- Dashboard cards -->
      <div class="dashboard-cards">
        <div class="dash-card">
          <div class="dash-card-label">Início</div>
          <div class="dash-card-valor" id="cardInicio">—</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-label">Previsão</div>
          <div class="dash-card-valor" id="cardPrevisao">—</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-label">Dias decorridos</div>
          <div class="dash-card-valor" id="cardDias">—</div>
          <div class="dash-card-sub" id="cardDiasSub"></div>
        </div>
        <div class="dash-card">
          <div class="dash-card-label">Tarefas</div>
          <div class="dash-card-valor" id="cardTarefas">—</div>
          <div class="dash-card-sub" id="cardTarefasSub"></div>
        </div>
      </div>

      <!-- Blocos de responsabilidade -->
      <div class="responsabilidade-wrap">
        <div class="resp-card paleta">
          <div class="resp-card-titulo">🎯 Paleta</div>
          <div class="resp-card-nums">
            <div class="resp-card-total" id="respPaletaTotal">0</div>
            <div class="resp-card-det" id="respPaletaDet"></div>
          </div>
        </div>
        <div class="resp-card cliente">
          <div class="resp-card-titulo">📋 Você</div>
          <div class="resp-card-nums">
            <div class="resp-card-total" id="respClienteTotal">0</div>
            <div class="resp-card-det" id="respClienteDet"></div>
          </div>
        </div>
      </div>

      <!-- Próxima etapa -->
      <div id="proximaEtapaWrap" class="proxima-etapa hidden">
        <div class="proxima-etapa-icon">→</div>
        <div>
          <div class="proxima-etapa-label">Próxima etapa</div>
          <div class="proxima-etapa-nome" id="proximaEtapaNome"></div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs-bar">
        <button class="tab-btn active" data-tab="tabEtapas">Etapas</button>
        <button class="tab-btn" data-tab="tabLogs">Histórico</button>
      </div>

      <!-- Tab Etapas -->
      <div id="tabEtapas" class="detalhe-tab-content">
        <div id="etapasWrap" class="etapas-wrap"></div>
        <div id="loadingState" class="loading-state">
          <div class="spinner"></div>
          <p>Carregando seu onboarding...</p>
        </div>
      </div>

      <!-- Tab Logs -->
      <div id="tabLogs" class="detalhe-tab-content hidden">
        <div id="logsWrap" class="logs-wrap">
          <div class="loading-state"><div class="spinner"></div></div>
        </div>
      </div>

    </main>

    <footer class="rodape">Plataforma exclusiva Grupo Paleta</footer>

    <!-- WhatsApp flutuante -->
    <a href="https://wa.me/5592984890543?text=Olá%20Júlia%2C%20tenho%20uma%20dúvida%20sobre%20meu%20onboarding!"
      target="_blank" class="whatsapp-float" title="Falar com a Júlia">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <span class="whatsapp-label">Falar com a Júlia</span>
    </a>

  </div>

  <script type="module" src="/js/cliente.js"></script>
</body>
</html>
